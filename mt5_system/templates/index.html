<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT5 顶配盯盘系统</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.0/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #00d4ff;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #888;
            font-size: 1.1em;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #16213e;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-label {
            color: #888;
            font-size: 0.9em;
        }

        .status-value {
            color: #00d4ff;
            font-weight: bold;
            font-size: 1.1em;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
        }

        .status-indicator.active {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .card h3 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 1.2em;
            border-bottom: 2px solid #0f3460;
            padding-bottom: 10px;
        }

        .account-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .info-item {
            background: #0f3460;
            padding: 15px;
            border-radius: 8px;
        }

        .info-label {
            color: #888;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .info-value {
            color: #00ff88;
            font-size: 1.3em;
            font-weight: bold;
        }

        .info-value.negative {
            color: #ff4444;
        }

        .positions-table {
            width: 100%;
            border-collapse: collapse;
        }

        .positions-table th,
        .positions-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #0f3460;
        }

        .positions-table th {
            color: #00d4ff;
            font-weight: bold;
        }

        .positions-table tr:hover {
            background: #0f3460;
        }

        .symbol-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .symbol-item {
            background: #0f3460;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .symbol-item:hover {
            background: #1a1a2e;
            transform: translateY(-2px);
        }

        .symbol-name {
            color: #00d4ff;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .symbol-price {
            color: #00ff88;
            font-size: 1.5em;
            font-weight: bold;
        }

        .symbol-change {
            color: #888;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .symbol-change.positive {
            color: #00ff88;
        }

        .symbol-change.negative {
            color: #ff4444;
        }

        .chart-container {
            height: 400px;
            margin-top: 15px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #00d4ff;
            color: #1a1a2e;
        }

        .btn-primary:hover {
            background: #00a8cc;
        }

        .btn-danger {
            background: #ff4444;
            color: #fff;
        }

        .btn-danger:hover {
            background: #cc3333;
        }

        .btn-success {
            background: #00ff88;
            color: #1a1a2e;
        }

        .btn-success:hover {
            background: #00cc6a;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #888;
        }

        .error {
            background: #3a1a1a;
            color: #ff4444;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .account-info {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 MT5 顶配盯盘系统</h1>
            <p>实时监控 · 智能分析 · 自动交易</p>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-indicator" id="statusIndicator"></div>
                <span class="status-label">系统状态:</span>
                <span class="status-value" id="systemStatus">离线</span>
            </div>
            <div class="status-item">
                <span class="status-label">最后更新:</span>
                <span class="status-value" id="lastUpdate">--</span>
            </div>
            <div class="status-item">
                <span class="status-label">持仓数:</span>
                <span class="status-value" id="positionsCount">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">信号数:</span>
                <span class="status-value" id="signalsCount">0</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="connectMT5()">连接 MT5</button>
            <button class="btn btn-danger" onclick="disconnectMT5()">断开连接</button>
            <button class="btn btn-success" onclick="refreshData()">刷新数据</button>
        </div>

        <div id="errorMessage" class="error" style="display: none;"></div>

        <div class="grid">
            <div class="card">
                <h3>💰 账户信息</h3>
                <div id="accountInfo" class="account-info">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <div class="card">
                <h3>📊 当前持仓</h3>
                <div id="positionsInfo">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>📈 交易品种</h3>
            <div id="symbolsList" class="symbol-list">
                <div class="loading">加载中...</div>
            </div>
        </div>

        <div class="card">
            <h3>📉 K线图表</h3>
            <div class="controls">
                <select id="symbolSelect" onchange="loadChart()">
                    <option value="EURUSD">EURUSD</option>
                    <option value="GBPUSD">GBPUSD</option>
                    <option value="USDJPY">USDJPY</option>
                    <option value="XAUUSD">XAUUSD (黄金)</option>
                    <option value="XAGUSD">XAGUSD (白银)</option>
                </select>
                <select id="timeframeSelect" onchange="loadChart()">
                    <option value="M1">1 分钟</option>
                    <option value="M5">5 分钟</option>
                    <option value="M15">15 分钟</option>
                    <option value="M30">30 分钟</option>
                    <option value="H1" selected>1 小时</option>
                    <option value="H4">4 小时</option>
                    <option value="D1">1 天</option>
                </select>
            </div>
            <div id="chartContainer" class="chart-container"></div>
        </div>

        <div class="card">
            <h3>📊 技术指标</h3>
            <div id="indicatorsChart" class="chart-container"></div>
        </div>
    </div>

    <script>
        // WebSocket 连接
        const socket = io();

        // 当前选中的品种
        let currentSymbol = 'EURUSD';
        let chartInstance = null;
        let indicatorsChartInstance = null;

        // 连接状态更新
        socket.on('status', (data) => {
            updateStatus(data);
        });

        // 账户信息更新
        socket.on('account', (data) => {
            updateAccountInfo(data);
        });

        // 持仓信息更新
        socket.on('positions', (data) => {
            updatePositions(data);
        });

        // 实时报价更新
        socket.on('tick', (data) => {
            updateTick(data);
        });

        // 连接 MT5
        async function connectMT5() {
            try {
                const response = await fetch('/api/connect', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });

                const result = await response.json();

                if (result.success) {
                    showSuccess('连接成功');
                    refreshData();
                } else {
                    showError(result.message);
                }
            } catch (error) {
                showError('连接失败: ' + error.message);
            }
        }

        // 断开 MT5 连接
        async function disconnectMT5() {
            try {
                const response = await fetch('/api/disconnect', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });

                const result = await response.json();

                if (result.success) {
                    showSuccess('已断开连接');
                    updateStatus({ connected: false });
                } else {
                    showError(result.message);
                }
            } catch (error) {
                showError('断开连接失败: ' + error.message);
            }
        }

        // 刷新数据
        async function refreshData() {
            await loadStatus();
            await loadAccountInfo();
            await loadPositions();
            await loadSymbols();
            await loadChart();
            await loadIndicators();
        }

        // 加载状态
        async function loadStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                updateStatus(data);
            } catch (error) {
                console.error('加载状态失败:', error);
            }
        }

        // 加载账户信息
        async function loadAccountInfo() {
            try {
                const response = await fetch('/api/account');
                const data = await response.json();

                if (data.error) {
                    document.getElementById('accountInfo').innerHTML = '<div class="error">' + data.error + '</div>';
                    return;
                }

                updateAccountInfo(data);
            } catch (error) {
                console.error('加载账户信息失败:', error);
            }
        }

        // 加载持仓信息
        async function loadPositions() {
            try {
                const response = await fetch('/api/positions');
                const data = await response.json();

                if (data.error) {
                    document.getElementById('positionsInfo').innerHTML = '<div class="error">' + data.error + '</div>';
                    return;
                }

                updatePositions(data);
            } catch (error) {
                console.error('加载持仓信息失败:', error);
            }
        }

        // 加载交易品种
        async function loadSymbols() {
            try {
                const response = await fetch('/api/symbols');
                const symbols = await response.json();

                if (symbols.error) {
                    document.getElementById('symbolsList').innerHTML = '<div class="error">' + symbols.error + '</div>';
                    return;
                }

                updateSymbols(symbols);
            } catch (error) {
                console.error('加载交易品种失败:', error);
            }
        }

        // 加载图表
        async function loadChart() {
            const symbol = document.getElementById('symbolSelect').value;
            const timeframe = document.getElementById('timeframeSelect').value;

            try {
                const response = await fetch(`/api/rates/${symbol}?timeframe=${timeframe}&count=100`);
                const data = await response.json();

                if (data.error) {
                    document.getElementById('chartContainer').innerHTML = '<div class="error">' + data.error + '</div>';
                    return;
                }

                renderChart(data);
            } catch (error) {
                console.error('加载图表失败:', error);
            }
        }

        // 加载技术指标
        async function loadIndicators() {
            const symbol = document.getElementById('symbolSelect').value;
            const timeframe = document.getElementById('timeframeSelect').value;

            try {
                const response = await fetch(`/api/indicators/${symbol}?timeframe=${timeframe}&count=100`);
                const data = await response.json();

                if (data.error) {
                    document.getElementById('indicatorsChart').innerHTML = '<div class="error">' + data.error + '</div>';
                    return;
                }

                renderIndicatorsChart(data);
            } catch (error) {
                console.error('加载技术指标失败:', error);
            }
        }

        // 更新状态
        function updateStatus(data) {
            const indicator = document.getElementById('statusIndicator');
            const status = document.getElementById('systemStatus');
            const lastUpdate = document.getElementById('lastUpdate');
            const positionsCount = document.getElementById('positionsCount');
            const signalsCount = document.getElementById('signalsCount');

            if (data.connected) {
                indicator.classList.add('active');
                status.textContent = '在线';
                status.style.color = '#00ff88';
            } else {
                indicator.classList.remove('active');
                status.textContent = '离线';
                status.style.color = '#ff4444';
            }

            if (data.last_update) {
                lastUpdate.textContent = new Date(data.last_update).toLocaleString();
            }

            positionsCount.textContent = data.positions_count || 0;
            signalsCount.textContent = data.signals_count || 0;
        }

        // 更新账户信息
        function updateAccountInfo(data) {
            const container = document.getElementById('accountInfo');

            const profitClass = data.profit >= 0 ? '' : 'negative';

            container.innerHTML = `
                <div class="info-item">
                    <div class="info-label">账户余额</div>
                    <div class="info-value">$${data.balance.toFixed(2)}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">账户净值</div>
                    <div class="info-value">$${data.equity.toFixed(2)}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">已用保证金</div>
                    <div class="info-value">$${data.margin.toFixed(2)}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">可用保证金</div>
                    <div class="info-value">$${data.free_margin.toFixed(2)}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">保证金水平</div>
                    <div class="info-value">${data.margin_level.toFixed(2)}%</div>
                </div>
                <div class="info-item">
                    <div class="info-label">浮动盈亏</div>
                    <div class="info-value ${profitClass}">$${data.profit.toFixed(2)}</div>
                </div>
            `;
        }

        // 更新持仓信息
        function updatePositions(data) {
            const container = document.getElementById('positionsInfo');

            if (!data || data.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">暂无持仓</div>';
                return;
            }

            let html = '<table class="positions-table"><thead><tr><th>品种</th><th>类型</th><th>手数</th><th>开仓价</th><th>当前价</th><th>盈亏</th></tr></thead><tbody>';

            data.forEach(pos => {
                const type = pos.type === 0 ? '买入' : '卖出';
                const profitClass = pos.profit >= 0 ? '' : 'negative';

                html += `
                    <tr>
                        <td>${pos.symbol}</td>
                        <td>${type}</td>
                        <td>${pos.volume.toFixed(2)}</td>
                        <td>${pos.price_open.toFixed(5)}</td>
                        <td>${pos.price_current.toFixed(5)}</td>
                        <td class="${profitClass}">$${pos.profit.toFixed(2)}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // 更新品种列表
        function updateSymbols(symbols) {
            const container = document.getElementById('symbolsList');

            if (!symbols || symbols.length === 0) {
                container.innerHTML = '<div class="error">无法加载交易品种</div>';
                return;
            }

            let html = '';
            symbols.forEach(symbol => {
                html += `
                    <div class="symbol-item" onclick="selectSymbol('${symbol}')">
                        <div class="symbol-name">${symbol}</div>
                        <div class="symbol-price">--</div>
                        <div class="symbol-change">--</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // 更新实时报价
        function updateTick(data) {
            const symbolItems = document.querySelectorAll('.symbol-item');
            symbolItems.forEach(item => {
                const name = item.querySelector('.symbol-name').textContent;
                if (name === data.symbol) {
                    const price = item.querySelector('.symbol-price');
                    const change = item.querySelector('.symbol-change');

                    price.textContent = data.bid.toFixed(5);

                    // 计算变化（这里需要存储之前的价格）
                    const prevPrice = parseFloat(price.dataset.prev) || data.bid;
                    const diff = data.bid - prevPrice;
                    const percent = (diff / prevPrice) * 100;

                    change.textContent = `${diff >= 0 ? '+' : ''}${diff.toFixed(5)} (${percent.toFixed(2)}%)`;
                    change.className = 'symbol-change ' + (diff >= 0 ? 'positive' : 'negative');

                    price.dataset.prev = data.bid;
                }
            });
        }

        // 选择品种
        function selectSymbol(symbol) {
            document.getElementById('symbolSelect').value = symbol;
            loadChart();
            loadIndicators();
        }

        // 渲染图表
        function renderChart(data) {
            const container = document.getElementById('chartContainer');

            if (chartInstance) {
                chartInstance.dispose();
            }

            chartInstance = echarts.init(container);

            const dates = data.map(item => item.time);
            const values = data.map(item => item.close);

            const option = {
                title: {
                    text: currentSymbol + ' K线图',
                    left: 'center',
                    textStyle: {
                        color: '#00d4ff'
                    }
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross'
                    }
                },
                grid: {
                    left: '10%',
                    right: '10%',
                    bottom: '15%'
                },
                xAxis: {
                    data: dates,
                    axisLine: {
                        lineStyle: {
                            color: '#888'
                        }
                    }
                },
                yAxis: {
                    scale: true,
                    splitLine: {
                        show: true,
                        lineStyle: {
                            color: '#0f3460'
                        }
                    },
                    axisLine: {
                        lineStyle: {
                            color: '#888'
                        }
                    }
                },
                dataZoom: [
                    {
                        type: 'inside',
                        start: 50,
                        end: 100
                    },
                    {
                        show: true,
                        type: 'slider',
                        top: '90%',
                        start: 50,
                        end: 100
                    }
                ],
                series: [{
                    name: '价格',
                    type: 'line',
                    data: values,
                    smooth: true,
                    lineStyle: {
                        color: '#00d4ff',
                        width: 2
                    },
                    areaStyle: {
                        color: {
                            type: 'linear',
                            x: 0,
                            y: 0,
                            x2: 0,
                            y2: 1,
                            colorStops: [{
                                offset: 0,
                                color: 'rgba(0, 212, 255, 0.3)'
                            }, {
                                offset: 1,
                                color: 'rgba(0, 212, 255, 0.05)'
                            }]
                        }
                    }
                }]
            };

            chartInstance.setOption(option);
        }

        // 渲染技术指标图表
        function renderIndicatorsChart(data) {
            const container = document.getElementById('indicatorsChart');

            if (indicatorsChartInstance) {
                indicatorsChartInstance.dispose();
            }

            indicatorsChartInstance = echarts.init(container);

            const dates = data.map(item => item.time);
            const rsi = data.map(item => item.rsi);
            const macd = data.map(item => item.macd);
            const signal = data.map(item => item.signal);

            const option = {
                title: {
                    text: '技术指标',
                    left: 'center',
                    textStyle: {
                        color: '#00d4ff'
                    }
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross'
                    }
                },
                legend: {
                    data: ['RSI', 'MACD', 'Signal'],
                    top: 30,
                    textStyle: {
                        color: '#888'
                    }
                },
                grid: {
                    left: '10%',
                    right: '10%',
                    bottom: '15%'
                },
                xAxis: {
                    data: dates,
                    axisLine: {
                        lineStyle: {
                            color: '#888'
                        }
                    }
                },
                yAxis: [
                    {
                        type: 'value',
                        name: 'RSI',
                        min: 0,
                        max: 100,
                        splitLine: {
                            show: true,
                            lineStyle: {
                                color: '#0f3460'
                            }
                        },
                        axisLine: {
                            lineStyle: {
                                color: '#888'
                            }
                        }
                    },
                    {
                        type: 'value',
                        name: 'MACD',
                        splitLine: {
                            show: false
                        },
                        axisLine: {
                            lineStyle: {
                                color: '#888'
                            }
                        }
                    }
                ],
                series: [
                    {
                        name: 'RSI',
                        type: 'line',
                        data: rsi,
                        yAxisIndex: 0,
                        lineStyle: {
                            color: '#00ff88'
                        }
                    },
                    {
                        name: 'MACD',
                        type: 'line',
                        data: macd,
                        yAxisIndex: 1,
                        lineStyle: {
                            color: '#00d4ff'
                        }
                    },
                    {
                        name: 'Signal',
                        type: 'line',
                        data: signal,
                        yAxisIndex: 1,
                        lineStyle: {
                            color: '#ff4444'
                        }
                    }
                ]
            };

            indicatorsChartInstance.setOption(option);
        }

        // 显示成功消息
        function showSuccess(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.style.display = 'block';
            errorDiv.style.background = '#1a3a1a';
            errorDiv.style.color = '#00ff88';
            errorDiv.textContent = message;

            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }

        // 显示错误消息
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.style.display = 'block';
            errorDiv.style.background = '#3a1a1a';
            errorDiv.style.color = '#ff4444';
            errorDiv.textContent = message;

            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // 窗口大小改变时重新渲染图表
        window.addEventListener('resize', () => {
            if (chartInstance) {
                chartInstance.resize();
            }
            if (indicatorsChartInstance) {
                indicatorsChartInstance.resize();
            }
        });

        // 页面加载时初始化
        window.addEventListener('load', () => {
            refreshData();
        });
    </script>
</body>
