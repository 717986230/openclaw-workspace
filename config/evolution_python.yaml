## 立即落地：Uv集成

### 安装Uv

```bash
# Windows
powershell -c "irm https://astral.sh/uv/install.ps1 | iex"

# Linux/Mac
curl -LsSf https://astral.sh/uv/install.sh | sh
```

### 迁移脚本

```python
# scripts/install_with_uv.py
"""使用Uv安装依赖"""
import subprocess
import sys

def install(package):
    """使用uv安装包"""
    subprocess.run([sys.executable, "-m", "uv", "pip", "install", package])

def sync():
    """同步依赖"""
    subprocess.run([sys.executable, "-m", "uv", "pip", "sync", "requirements.txt"])
```

